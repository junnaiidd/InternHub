{% extends 'base.html' %}
{% block title %}Reset Password — InternHub{% endblock %}

{% block public_content %}
<div class="auth-split-wrapper fade-in-up">
    <div class="bento-card p-4 p-md-5" style="max-width: 480px; width: 100%;">
        <div class="text-center mb-4">
            <div class="activity-icon-badge activity-icon-blue mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.3rem;">
                <i class="bi bi-key-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">Reset Password</h3>
            <p class="text-muted small">Enter your email address to receive a secure recovery token.</p>
        </div>

        <form method="POST" action="{{ url_for('forgot_password') }}" novalidate>
            <div class="mb-4">
                <label class="form-label fw-bold small" for="email">Account Email Address</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="name@university.edu or name@company.com" required autofocus>
            </div>

            <button type="submit" class="btn-tech-primary w-100 py-2 mb-3 shadow-sm justify-content-center">
                <i class="bi bi-envelope-paper-fill"></i>Send Recovery Token
            </button>
        </form>

        <div class="text-center pt-2 border-top">
            <a href="{{ url_for('login') }}" class="small text-muted">
                <i class="bi bi-arrow-left me-1"></i>Return to Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block content %}{% block content_unauth %}{% endblock %}{% endblock %}
