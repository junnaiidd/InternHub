{% extends 'base.html' %}
{% block title %}Set New Password — InternHub{% endblock %}

{% block public_content %}
<div class="auth-split-wrapper fade-in-up">
    <div class="bento-card p-4 p-md-5" style="max-width: 480px; width: 100%;">
        <div class="text-center mb-4">
            <div class="activity-icon-badge activity-icon-teal mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.3rem;">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">Set New Password</h3>
            <p class="text-muted small">Choose a new secure password for your account.</p>
        </div>

        <form method="POST" novalidate>
            <div class="mb-3">
                <label class="form-label fw-bold small" for="password">New Password</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Min 6 characters" required autofocus>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold small" for="confirm_password">Confirm Password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                       placeholder="Re-enter new password" required>
            </div>

            <button type="submit" class="btn-tech-primary w-100 py-2 mb-3 shadow-sm justify-content-center">
                <i class="bi bi-check-circle-fill"></i>Update Password
            </button>
        </form>

        <div class="text-center pt-2 border-top">
            <a href="{{ url_for('login') }}" class="small text-muted">
                <i class="bi bi-arrow-left me-1"></i>Return to Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block content %}{% block content_unauth %}{% endblock %}{% endblock %}
